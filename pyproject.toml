[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmesh"
version = "0.1.0"
description = "Lint a collection of agent SKILL.md files: duplicates, contradictory directives, trigger ambiguity, token cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["agents", "skills", "prompt-ops", "linter", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
skillmesh = "skillmesh.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]